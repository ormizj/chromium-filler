<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Careers — Platform Engineer</title>
    <style>
      body { font: 15px/1.6 system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
      iframe { width: 100%; height: 720px; border: 1px solid #d1d5db; border-radius: 8px; }
    </style>
  </head>
  <body>
    <!--
      The company's own careers page, with the application form embedded from the
      ATS on another origin — the way Greenhouse, Lever and iCIMS embeds work. The
      page itself has no inputs at all: everything to fill is inside the frame, which
      a content script in the top frame cannot see into.
    -->
    <h1>Platform Engineer</h1>
    <p>Acme is hiring. Apply below — the form is hosted by our applicant tracking system.</p>
    <iframe id="ats-frame" title="Application form" src="http://127.0.0.1:5200/sites/ats-form.html"></iframe>
  </body>
</html>
