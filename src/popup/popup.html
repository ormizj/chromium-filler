<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/primitives.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <span class="mark" aria-hidden="true">F</span>
        <h1>Chromium Filler</h1>
        <span id="site-status" class="chip">…</span>
      </header>

      <p id="detail" class="detail">Checking this page…</p>

      <!-- First-run nudge: with no profile and no CV there is nothing to fill
           with, and reporting "no config matches this page" sends a new user
           looking in entirely the wrong place. -->
      <a id="nudge" class="nudge" href="#" hidden></a>

      <div id="session" class="session" hidden>
        <div class="prog">
          <div class="prog-n"><b id="session-count"></b><small id="session-total"></small></div>
          <div class="prog-cap" id="session-detail"></div>
          <div class="bar"><i id="session-bar"></i></div>
        </div>
        <div class="meta" id="session-chips"></div>
        <button id="session-skip" class="btn">Skip &amp; next</button>
      </div>

      <!-- Two rows, in fixed proportions, and every control in them is always
           present. They used to appear and disappear with the page's state — Site
           setup only on a configured site, Queue only when something was waiting —
           so the popup was a different shape every time it opened and the one
           control that never moved, Options, was left as a small button adrift
           under a full-width Fill. Where a thing is is half of knowing it exists.

           The one thing this popup does to the page in front of you gets a row to
           itself; the three that open another surface share the one below it. -->
      <div class="actions">
        <button id="primary" class="btn btn-primary" disabled>Fill</button>
      </div>

      <div class="links">
        <!-- Short labels, and no arrow: these are button-shaped, and the reference's
             secondary row is one-word verbs. As sentences they wrapped onto a second
             line in a 360px popup and left the row ragged — which matters more now
             that there are three of them sharing 336px.
             The arrow stays on `.nudge`, which is a prompt rather than a button. -->
        <a id="reconfigure" href="#">Site setup</a>
        <a id="open-queue" href="#">Queue</a>
        <a id="open-options" href="#">Options</a>
      </div>
      <div id="build" class="build"></div>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
